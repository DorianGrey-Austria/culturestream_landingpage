    <style>
        /* Moderne Typografie Stack */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');

        /* Stil für die Header-Buttons */
        .header-buttons {
            display: flex;
            gap: 12px;
            position: fixed;
            top: 24px;
            right: 120px;
            z-index: 100;
        }

        .header-button {
            padding: 12px 24px;
            background: linear-gradient(135deg, var(--primary, #D65108) 0%, var(--secondary, #e67e30) 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 16px rgba(214, 81, 8, 0.2);
            position: relative;
            overflow: hidden;
        }

        .header-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, transparent 0%, rgba(255, 255, 255, 0.1) 100%);
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        .header-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 24px rgba(214, 81, 8, 0.35);
        }

        .header-button:hover::before {
            opacity: 1;
        }

        /* Responsive Design für die Buttons */
        @media (max-width: 768px) {
            .header-buttons {
                top: 16px;
                right: 70px;
                gap: 8px;
            }

            .header-button {
                padding: 10px 18px;
                font-size: 14px;
            }

            --secondary: #e67e30;
            --accent: #f8f6f3;
            --background: #ffffff;
            --foreground: #1a1a1a;
            --border: #e5e7eb;
            --input: #f3f4f6;
            --ring: #d65108;
            --radius: 0.75rem;
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.04);
            --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.08);
            --shadow-lg: 0 8px 32px rgba(0, 0, 0, 0.12);
        }

        /* Allgemeine Stile mit moderner Typografie */
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--background);
            color: var(--foreground);

            -moz-osx-font-smoothing: grayscale;
        }

        .min-h-screen {
            min-height: 100vh;
        }

        .relative {
            position: relative;
        }

        .fixed {
            position: fixed;
        }

        .flex {
            display: flex;
        }

        .items-center {
            align-items: center;
        }

        .justify-center {
            justify-content: center;
        }

        .text-center {
            text-align: center;
        }

        .container {
            width: 100%;
            max-width: 1200px;
            margin-left: auto;
            margin-right: auto;
            padding-left: 1rem;
            padding-right: 1rem;
        }

        .rounded-full {
            border-radius: 9999px;
        }

        /* Stilisierter Gradient-Text */
        .text-transparent {
            color: transparent;
        }

        .bg-clip-text {
            -webkit-background-clip: text;
            background-clip: text;
        }

        .bg-gradient-to-r {
            background-image: linear-gradient(to right, var(--primary), var(--secondary));
        }

        /* Hero-Sektion - Modern & Professional */

            overflow: hidden;
            background: linear-gradient(135deg, var(--background) 0%, var(--accent) 50%, #fff5eb 100%);

            font-weight: 700;

        .mb-8 {

        .bg-primary {

            box-shadow: 0 4px 16px rgba(214, 81, 8, 0.25);

            top: 0;

            width: 100%;
            height: 100%;

        }

        .bg-primary:hover {
            box-shadow: 0 8px 32px rgba(214, 81, 8, 0.35);

        }

        .text-white {
            color: white;
        }

        .px-8 {
            padding-left: 2.5rem;
            padding-right: 2.5rem;
        }

        .py-4 {
            padding-top: 1.25rem;
            padding-bottom: 1.25rem;
        }

        .text-lg {
            font-size: 1.125rem;
            font-weight: 600;
        }

        .font-semibold {
            font-weight: 600;
        }

        .transition-all {
            transition-property: all;
            transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
            transition-duration: 400ms;
        }

        .hover\:scale-105:hover {
            transform: scale(1.05) translateY(-2px);
        }

        /* Navigation */
        .fixed.right-8 {
            right: 2rem;
        }

        .top-1\/2 {
            top: 50%;
        }

        .-translate-y-1\/2 {
            transform: translateY(-50%);
        }

        .z-50 {
            z-index: 50;
        }

        .flex-col {
            flex-direction: column;
        }

        .gap-6 {
            gap: 1.5rem;
        }

        .w-3 {
            width: 0.75rem;
        }

        .h-3 {
            height: 0.75rem;
        }

        .transition-all {
            transition-property: all;
        }

        .duration-300 {
            transition-duration: 300ms;
        }

        .bg-primary {
            background-color: var(--primary);
        }

        .scale-150 {
            transform: scale(1.5);
        }

        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border-width: 0;
        }

        /* Theme Toggle Button - Modern */
        .theme-toggle {
            background: white;
            border: 2px solid var(--border);
            box-shadow: var(--shadow-md);
            backdrop-filter: blur(10px);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .theme-toggle:hover {
            transform: scale(1.1) rotate(12deg);
            box-shadow: var(--shadow-lg);
            border-color: var(--primary);
        }

        /* Navigation Dots - Modern */
        nav button {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        nav button:hover {
            transform: scale(1.3);
        }

        nav button.active {

            transform: scale(1.5);
        }

        /* Responsive-Anpassungen */
        @media (min-width: 768px) {
            .md\:text-7xl {
                font-size: 5rem;
                letter-spacing: -0.03em;
            }

            .md\:text-3xl {

            }
        }

        @media (max-width: 480px) {
            .text-5xl {
                font-size: 2rem;
            }

            .gap-8 {
                gap: 1.5rem;
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <script>
        // Einfaches Theme-Toggle-Skript, das ohne die komplexe Next.js-Funktionalität funktioniert
        function toggleTheme() {
            const isDark = document.body.classList.contains('dark-mode');
            if (isDark) {
                document.body.classList.remove('dark-mode');
                localStorage.setItem('theme', 'light');
            } else {
                document.body.classList.add('dark-mode');
                localStorage.setItem('theme', 'dark');
            }
        }

        // Theme aus localStorage wiederherstellen
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme === 'dark') {
            document.body.classList.add('dark-mode');
        }
    </script>

    <div class="header-buttons">
        <a href="#" class="header-button home-button">Home</a>
        <a href="intern/index.html" class="header-button login-button">Intern</a>

    </div>

    <script>
        // Funktion zum Scrollen zu bestimmten Sektionen
        function scrollToSection(sectionId) {
            const section = document.getElementById(sectionId);
            if (section) {
                section.scrollIntoView({ behavior: 'smooth' });
            }
        }
        
        // Dark Mode Toggle Funktion
        document.addEventListener('DOMContentLoaded', function() {
            const themeToggle = document.querySelector('[aria-label="Theme Toggle"]');
            const sunIcon = document.querySelector('.sun-icon');
            const moonIcon = document.querySelector('.moon-icon');
            
            if (document.body.classList.contains('dark-mode')) {
                sunIcon.style.display = 'none';
                moonIcon.style.display = 'block';
            }
            
            themeToggle.addEventListener('click', function() {
                if (document.body.classList.contains('dark-mode')) {
                    sunIcon.style.display = 'block';
                    moonIcon.style.display = 'none';
                } else {
                    sunIcon.style.display = 'none';
                    moonIcon.style.display = 'block';
                }
            });
            
            // Fade-In-Effekt für Sektionen beim Scrollen
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.style.opacity = '1';
                        entry.target.style.transform = 'translateY(0)';
                    }
                });
            }, { threshold: 0.1 });
            
            document.querySelectorAll('section').forEach(section => {
                section.style.opacity = '0';
                section.style.transform = 'translateY(20px)';
                section.style.transition = 'opacity 0.5s ease, transform 0.5s ease';
                observer.observe(section);
            });
        });
    </script>
